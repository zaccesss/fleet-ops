name: Documentation
description: Something in the docs is wrong, missing or unclear
title: "docs: "
labels: ["documentation"]
assignees: ["zaccesss"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      description: The file or link, such as docs/getting-started.md.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Quote the part that is wrong where you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
