# a version tag publishes a release. The tag is checked against every manifest and the changelog
# first. Then the release is created from its changelog section if it does not exist yet. A source
# archive goes on the release with its checksum and a signed build provenance. The runner image goes
# to GitHub Container Registry with an attestation of its own.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Check and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # the provenance is signed with a short-lived Sigstore certificate tied to this workflow
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the versions and read the notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG" /tmp/notes.md

      # a release made by hand with the same notes is left as it is
      - name: Create the release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag

      # git archive of the tag, so the archive holds exactly what the tag points at
      - name: Build the source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="fleet-ops-${TAG}/" -o "dist/fleet-ops-${TAG}.tar.gz" "$TAG"
          (cd dist && sha256sum "fleet-ops-${TAG}.tar.gz" > SHA256SUMS)

      - name: Sign the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/fleet-ops-*.tar.gz

      # the same Sigstore bundle under the two names release tooling looks for. Either one verifies
      # with gh attestation verify.
      - name: Attach the archive, checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/fleet-ops-${TAG}.tar.gz.intoto.jsonl"
          cp "$BUNDLE" "dist/fleet-ops-${TAG}.tar.gz.sigstore.json"
          gh release upload "$TAG" dist/* --clobber

  image:
    name: Publish the runner image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # tags 1.2.3, 1.2 and latest, with the source and licence labels GHCR shows on the package
      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleet-ops-runner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=fleet-ops runner
            org.opencontainers.image.description=The mirror and backup that the fleet-ops scheduler starts
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Strict-1.0.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: python
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      # a signed attestation stored next to the image, checked with gh attestation verify oci://...
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fleet-ops-runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
