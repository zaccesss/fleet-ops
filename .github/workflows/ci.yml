# type check and test on every pull request. Nothing here needs a secret: every test runs against
# fakes, so a pull request from a fork is checked the same way.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # includes a run of the real git binary against local bare repositories
      - name: Test
        run: python -m pytest -q

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # builds the runner image and checks the entry point starts, without pushing anything
      - name: Build and smoke test
        run: |
          docker build -t fleet-runner python
          docker run --rm fleet-runner mirror --help

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # proves each worker still bundles for Cloudflare without deploying anything
      - name: Bundle the workers
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          for w in workers/*/; do
            (cd "$w" && ../../node_modules/.bin/wrangler deploy --dry-run --outdir dist)
          done
