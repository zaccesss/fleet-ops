# every check a change must pass before it merges. Nothing here needs a secret: every test runs
# against fakes, so a pull request from a fork is checked the same way.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# a new push to the same pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # lint and formatting in one pass, failing on any difference
      - name: Biome
        run: npx --no-install biome ci .

      # the release from GitHub with its published checksum, so a tampered download fails
      - name: actionlint
        env:
          VERSION: "1.7.12"
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          file="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 5 -o "/tmp/${file}" "${base}/${file}"
          curl -sSfL --retry 5 -o /tmp/checksums.txt "${base}/actionlint_${VERSION}_checksums.txt"
          (cd /tmp && grep " ${file}\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${file}" -C /tmp actionlint
          /tmp/actionlint -color

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # fails when coverage drops under the thresholds in vitest.config.mts
      - name: Test with coverage
        run: npm run coverage

      # proves each worker still bundles for Cloudflare without deploying anything
      - name: Bundle the workers
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          for w in workers/*/; do
            (cd "$w" && ../../node_modules/.bin/wrangler deploy --dry-run --outdir dist)
          done

      - name: Keep the coverage report
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: coverage/
          retention-days: 14

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      # every dependency is pinned by hash, then the package itself is installed without fetching anything
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      # includes a run of the real git binary against local bare repositories. pytest fails when
      # coverage drops under fail_under in pyproject.toml.
      - name: Test with coverage
        run: python -m pytest -q

      - name: Keep the coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: python/coverage.xml
          retention-days: 14

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # builds the runner image and checks both entry points start, without pushing anything
      - name: Build and smoke test
        run: |
          docker build -t fleet-runner python
          docker run --rm fleet-runner mirror --help
          docker run --rm fleet-runner backup --help

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # every link in the docs, so a moved file or a dead page fails before it merges
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --cache --config lychee.toml './**/*.md'
          fail: true
