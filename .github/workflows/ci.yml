# type check and test on every pull request. Nothing here needs a secret: every test runs against
# fakes, so a pull request from a fork is checked the same way.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # proves each worker still bundles for Cloudflare without deploying anything
      - name: Bundle the workers
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          for w in workers/*/; do
            (cd "$w" && ../../node_modules/.bin/wrangler deploy --dry-run --outdir dist)
          done
